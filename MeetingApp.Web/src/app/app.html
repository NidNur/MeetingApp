<main class="app-shell">
  <header class="app-header">
    <div>
      <h1>Toplantı Yönetimi</h1>
      <p>Toplantılarınızı oluşturun, düzenleyin ve takip edin.</p>
    </div>

    <nav aria-label="Ana menü">
      @if (auth.user()) {
        <a routerLink="/account" routerLinkActive="active" ariaCurrentWhenActive="page">Hesabım</a>
        <button type="button" (click)="auth.logout()">Çıkış yap</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Giriş yap</a>
        <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page">Kayıt ol</a>
      }
    </nav>
  </header>

  <router-outlet></router-outlet>
</main>
